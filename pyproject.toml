[build-system]
requires = ["setuptools>=77"]
build-backend = "traqen_build"
backend-path = ["build_backend"]

[project]
name = "traqen"
dynamic = ["version"]
description = "Lightweight personal tracking for active work scattered across tools"
license = "LicenseRef-PolyForm-Strict-1.0.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "cryptography>=43",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "python-dotenv>=1,<2",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "respx>=0.21,<1",
  "ruff>=0.12,<1",
]

[tool.setuptools.dynamic]
version = { attr = "traqen._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
traqen = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
